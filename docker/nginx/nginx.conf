# Nginx reverse proxy cho production on-premise
# - /api/*  → backend .NET
# - /*      → website Next.js
# SSL: đặt cert vào docker/nginx/certs/ rồi uncomment phần 443

upstream backend_api {
    server api:8080;
}

upstream web_frontend {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # API backend
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger + health + Hangfire dashboard (giới hạn IP nội bộ khi lên production)
    location ~ ^/(swagger|health|hangfire) {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
    }

    # Website Next.js
    location / {
        proxy_pass http://web_frontend;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

