# Harness Ecommerce — hạ tầng on-premise đầy đủ
# Chạy:  docker compose up -d
# Cổng:  API :5080 (qua nginx :80/:443), PostgreSQL :5432, Redis :6379,
#        RabbitMQ :5672 (UI :15672), Elasticsearch :9200, MinIO :9000 (UI :9001),
#        Seq :5341 (UI :8081), Grafana :3000, Prometheus :9090

name: harness-ecommerce

services:
  # ============ DATABASE & CACHE ============
  postgresql:
    image: postgres:16-alpine
    container_name: harness-postgres
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: harness-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # ============ MESSAGE BROKER ============
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: harness-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: harness
      RABBITMQ_DEFAULT_PASS: harness
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    restart: unless-stopped

  # ============ SEARCH ============
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: harness-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped

  # ============ FILE STORAGE (S3-compatible) ============
  minio:
    image: minio/minio:latest
    container_name: harness-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: harness
      MINIO_ROOT_PASSWORD: harness123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - miniodata:/data
    restart: unless-stopped

  # ============ LOGGING ============
  seq:
    image: datalust/seq:latest
    container_name: harness-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"   # ingest endpoint (Serilog ghi về đây)
      - "8081:80"   # duplicate không cần — bỏ qua, dùng ingress riêng nếu muốn
    volumes:
      - seqdata:/data
    restart: unless-stopped

  # ============ MONITORING ============
  prometheus:
    image: prom/prometheus:latest
    container_name: harness-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: harness-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  esdata:
  miniodata:
  seqdata:
  promdata:
  grafanadata:
