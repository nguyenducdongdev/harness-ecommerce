apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: harness-ecommerce
  labels:
    app: admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: registry.example.vn/harness/admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: harness-ecommerce
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: admin
