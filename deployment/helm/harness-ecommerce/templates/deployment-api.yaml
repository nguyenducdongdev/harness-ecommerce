apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harness-ecommerce.fullname" . }}-api
  labels:
    app: {{ include "harness-ecommerce.fullname" . }}-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "harness-ecommerce.fullname" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "harness-ecommerce.fullname" . }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.imageRegistry }}/api:{{ .Values.api.tag }}"
          imagePullPolicy: {{ .Values.api.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "harness-ecommerce.fullname" . }}-config
            - secretRef:
                name: {{ include "harness-ecommerce.fullname" . }}-secret
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "harness-ecommerce.fullname" . }}-api-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: {{ include "harness-ecommerce.fullname" . }}-api
